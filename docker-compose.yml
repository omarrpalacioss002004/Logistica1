# ============================================================
# Sistema de Gestión Logística de Lubricantes
# Docker Compose — db + api + client
# ============================================================

version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-logistica}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logistica_secret_2024}
    # ELIMINADO: ports (No necesitas exponer la DB al mundo, solo a la API internamente)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed-zones.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-logistica}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-logistica_secret_2024}
      JWT_SECRET: ${JWT_SECRET}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
    # ELIMINADO: ports (Easypanel usará el puerto interno 4000)
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    # ELIMINADO: ports (Easypanel conectará su dominio al puerto 80 interno)
    depends_on:
      - api

volumes:
  pgdata:
    driver: local
