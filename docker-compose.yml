# ============================================================
# Sistema de Gestión Logística de Lubricantes
# Docker Compose — db + api + client
# ============================================================

version: '3.8'

services:
  # --------------------------------------------------------
  # PostgreSQL + PostGIS Database
  # --------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: logistica-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-logistica}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logistica_secret_2024}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed-zones.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # Node.js + Express API
  # --------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: logistica-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-logistica}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-logistica_secret_2024}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api/src:/app/src

  # --------------------------------------------------------
  # React + Nginx Client
  # --------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: logistica-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
    driver: local
